name: "[CN] 功能请求"
description: 先 Star。无权反馈流媒体。禁止奇葩许愿。下面有可直接点选的勾选框。
title: "[功能请求] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请点选下面的方框（不是改文字）。规范见 [Issue 规范](../ISSUE_POLICY.md)。
        自动关闭只打：没公开 Star、明确的流媒体功能请求、明确辱骂。离谱许愿请不要提。
  - type: checkboxes
    id: policy
    attributes:
      label: 提交前确认（点选即可）
      options:
        - label: 我已经给本仓库点了公开可见的 Star
          required: true
        - label: 这不是流媒体或第三方音乐平台相关内容
          required: true
        - label: 这是真实的缺陷或功能请求，不是找茬、嘲讽或发泄
          required: true
  - type: textarea
    id: want
    attributes:
      label: 想要什么
    validations:
      required: true
  - type: textarea
    id: scene
    attributes:
      label: 什么场景需要
      description: 真实使用场景，而不是只写“希望支持某功能”。
    validations:
      required: false
