# Add these locations inside the existing echonext.moe HTTPS server block.

location = /api/echo-pro/verify {
  limit_except POST { deny all; }
  proxy_pass http://127.0.0.1:8787/api/echo-pro/verify;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_read_timeout 10s;
}

location ~ ^/api/echo-pro/auth/(register|login|me|logout)$ {
  proxy_pass http://127.0.0.1:8787$request_uri;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_read_timeout 10s;
}

location = /api/echo-pro/settings/cloud {
  limit_except GET PUT { deny all; }
  client_max_body_size 8m;
  proxy_pass http://127.0.0.1:8787/api/echo-pro/settings/cloud;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_read_timeout 10s;
}

