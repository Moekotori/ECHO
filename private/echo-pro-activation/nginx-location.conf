# Add these locations inside the existing echonext.moe HTTPS server block.

location = /api/echo-pro/activate {
  limit_except POST { deny all; }
  proxy_pass http://127.0.0.1:8788/api/echo-pro/activate;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_read_timeout 30s;
}

location = /api/echo-pro/license/verify {
  limit_except POST { deny all; }
  proxy_pass http://127.0.0.1:8788/api/echo-pro/license/verify;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_read_timeout 10s;
}

location = /api/echo-pro/unbind {
  limit_except POST { deny all; }
  proxy_pass http://127.0.0.1:8788/api/echo-pro/unbind;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_read_timeout 10s;
}

location = /api/echo-pro/admin/unbind {
  limit_except POST { deny all; }
  proxy_pass http://127.0.0.1:8788/api/echo-pro/admin/unbind;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_read_timeout 10s;
}

location = /api/echo-pro/plugins/market {
  proxy_pass http://127.0.0.1:8788/api/echo-pro/plugins/market;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_read_timeout 10s;
}

location ~ ^/api/echo-pro/plugins/market/ {
  proxy_pass http://127.0.0.1:8788$request_uri;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_read_timeout 30s;
}
