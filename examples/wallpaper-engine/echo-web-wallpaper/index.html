<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ECHO Reactive Wallpaper</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
        background: #070912;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        display: grid;
        align-items: end;
        padding: clamp(28px, 6vw, 96px);
        color: #f6f7ff;
        background:
          radial-gradient(circle at 18% 20%, rgb(95 83 255 / calc(0.15 + var(--echo-energy, 0) * 0.38)), transparent 42%),
          radial-gradient(circle at 82% 68%, rgb(255 70 164 / calc(0.12 + var(--echo-transient, 0) * 0.32)), transparent 38%),
          linear-gradient(145deg, #080b19, #11142b 54%, #070912);
      }

      main {
        display: grid;
        gap: 24px;
        width: min(980px, 100%);
      }

      .eyebrow {
        margin: 0;
        color: #a8b0d8;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 900px;
        margin: 0;
        font-size: clamp(34px, 6vw, 84px);
        font-weight: 700;
        letter-spacing: -0.04em;
        line-height: 0.98;
        text-wrap: balance;
      }

      .meta {
        margin: -10px 0 0;
        color: #c6cae0;
        font-size: clamp(15px, 2vw, 22px);
      }

      .spectrum {
        display: grid;
        grid-template-columns: repeat(32, minmax(2px, 1fr));
        align-items: end;
        gap: clamp(2px, 0.45vw, 8px);
        height: min(28vh, 260px);
      }

      .spectrum > i {
        min-height: 3px;
        border-radius: 999px;
        background: linear-gradient(to top, #6c63ff, #ff53a7 72%, #fff);
        box-shadow: 0 0 22px rgb(117 99 255 / 0.3);
        transform-origin: bottom;
        transition: height 45ms linear, opacity 180ms ease;
      }

      .status {
        position: fixed;
        top: 24px;
        right: 28px;
        color: #a8b0d8;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      html[data-echo-state="connected"] .status {
        color: #8fffc5;
      }
    </style>
  </head>
  <body>
    <span class="status" id="status">等待 ECHO</span>
    <main>
      <p class="eyebrow">ECHO / Wallpaper Engine</p>
      <h1 id="title">打开 ECHO 开始播放</h1>
      <p class="meta" id="meta">本机实时频谱桥</p>
      <div class="spectrum" id="spectrum" aria-hidden="true"></div>
    </main>
    <script src="./wallpaper.js"></script>
  </body>
</html>
